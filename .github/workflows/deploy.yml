name: Deploy site
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate match data
        run: node tools/validate.mjs
      - name: Assemble site
        run: |
          mkdir _site
          cp -r site/* _site/
          cp -r data _site/data
      - name: Refresh Stockport league table
        continue-on-error: true
        run: node tools/fetch-league.mjs https://stockport-badminton.co.uk/tables/All _site/data/stockport-b/league.json
      - name: Refresh Shell A fixtures
        continue-on-error: true
        run: node tools/fetch-fixtures.mjs https://stockport-badminton.co.uk/results/Premier "Shell A" Premier _site/data/stockport-a/fixtures.json
      - name: Refresh Shell C fixtures
        continue-on-error: true
        run: node tools/fetch-fixtures.mjs https://stockport-badminton.co.uk/results/Division-2 "Shell C" "Division 2" _site/data/stockport-c/fixtures.json
      - name: Refresh Tameside league table
        continue-on-error: true
        run: node tools/fetch-league.mjs https://tameside-badminton.co.uk/tables/All _site/data/tameside/league.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
